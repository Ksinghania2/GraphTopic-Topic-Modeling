[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gtopic"
version = "1.0.0"
description = "Graph-based topic extraction from large text corpora"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gtopic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
